<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10. Підтвердження замовлення</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: white;
            gap: 40px;
        }
        .button {
            min-height: 120px;
            width: 90%;
            max-width: 600px;
            border: none;
            border-radius: 12px;
            font-size: clamp(40px, 6vw, 60px);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            background: #4CAF50;
            color: white;
        }
        .order-id {
            font-size: clamp(35px, 5vw, 50px);
            margin-top: 10px;
            font-weight: 500;
        }
        .hint-text {
            font-size: clamp(25px, 3.5vw, 35px);
            color: #757575;
            text-align: center;
            opacity: 0.5;
        }
        .nav-link, .back-link {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        .nav-link { bottom: 20px; right: 20px; }
        .back-link { top: 20px; left: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Всі екрани</a>

    <div class="screen">
        <button class="button">
            <div>ЗАТВЕРДИТИ ЦЕ ЗАМОВЛЕННЯ</div>
            <div class="order-id">(OUT/00123)</div>
        </button>

        <div class="hint-text">
            Натисніть для підтвердження
        </div>
    </div>

    <a href="screen-11-cancel-picking.html" class="nav-link">Наступний екран →</a>
</body>
</html>
