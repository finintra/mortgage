<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>08. Рядок закрито</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #4CAF50;
        }
        .screen-title {
            font-size: clamp(100px, 18vw, 150px);
            font-weight: 700;
            text-align: center;
            color: white;
            line-height: 1.2;
        }
        .nav-link, .back-link {
            position: fixed;
            background: rgba(255,255,255,0.3);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        .nav-link { bottom: 20px; right: 20px; }
        .back-link { top: 20px; left: 20px; }
            /* Password Protection */
        #password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        #password-overlay.hidden { display: none; }
        .password-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 90%; }
        .password-box h2 { margin-bottom: 10px; color: #333; font-size: 28px; }
        .password-box p { color: #666; margin-bottom: 25px; font-size: 16px; }
        .password-box input { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        .password-box input:focus { outline: none; border-color: #4CAF50; }
        .password-box button { width: 100%; padding: 15px; font-size: 18px; font-weight: 600; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .password-box button:hover { background: #45a049; }
        .password-error { color: #F44336; margin-top: 10px; font-size: 14px; display: none; }
        #main-content { display: none; }
        #main-content.visible { display: block; }
    </style>
</head>
<body>
    <div id="password-overlay">
        <div class="password-box">
            <h2>🔒 Захищено паролем</h2>
            <p>Введіть пароль для доступу</p>
            <input type="password" id="password-input" placeholder="Пароль" autofocus>
            <button onclick="checkPassword()">Увійти</button>
            <div class="password-error" id="password-error">Невірний пароль</div>
        </div>
    </div>
    <div id="main-content">
    <a href="index.html" class="back-link">← Всі екрани</a>

    <div class="screen">
        <h1 class="screen-title">
            ГОТОВО.<br />ДАЛІ
        </h1>
    </div>

    <a href="screen-09-order-completed.html" class="nav-link">Наступний екран →</a>
    </div>
    <script>
        const CORRECT_PASSWORD = 'mobileodoo';
        const AUTH_KEY = 'warehouse_app_auth';
        function checkAuth() { if (sessionStorage.getItem(AUTH_KEY) === 'true') showContent(); }
        function checkPassword() {
            const input = document.getElementById('password-input');
            const error = document.getElementById('password-error');
            if (input.value === CORRECT_PASSWORD) { sessionStorage.setItem(AUTH_KEY, 'true'); showContent(); error.style.display = 'none'; }
            else { error.style.display = 'block'; input.value = ''; input.focus(); }
        }
        function showContent() { document.getElementById('password-overlay').classList.add('hidden'); document.getElementById('main-content').classList.add('visible'); }
        document.addEventListener('DOMContentLoaded', function() { checkAuth(); document.getElementById('password-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkPassword(); }); });
    </script>
</body>
</html>
