<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>04. Сканування товарів (ГОЛОВНИЙ ЕКРАН)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            background: white;
        }
        .order-header {
            width: 100%;
            background: white;
            padding: 10px;
            text-align: center;
            border-bottom: 3px solid #000;
            font-size: clamp(35px, 7vw, 50px);
            font-weight: 700;
        }
        .scrollable-content {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 15px;
            gap: 8px;
        }
        .instruction-text {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 600;
            text-align: center;
            margin: 0;
        }
        .hint-text {
            font-size: clamp(18px, 3vw, 24px);
            color: #757575;
            text-align: center;
            margin: 0;
        }
        .counters-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 90%;
            max-width: 500px;
            margin: 8px 0;
        }
        .counter-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
        }
        .counter-label {
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 500;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .counter-value {
            font-size: clamp(80px, 15vw, 120px);
            font-weight: 700;
            line-height: 1;
        }
        .counter-remaining {
            background: #FFF3E0;
            color: #FF9800;
        }
        .counter-remaining .counter-value {
            color: #FF9800;
        }
        .counter-scanned {
            background: #E8F5E9;
            color: #4CAF50;
        }
        .counter-scanned .counter-value {
            color: #4CAF50;
        }
        .counter-total {
            background: #F5F5F5;
            color: #000;
        }
        .counter-total .counter-value {
            color: #000;
        }
        .fixed-bottom {
            width: 100%;
            padding: 8px 15px;
            background: white;
            border-top: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .button {
            min-height: 55px;
            width: 90%;
            max-width: 500px;
            border: none;
            border-radius: 10px;
            font-size: clamp(22px, 4vw, 32px);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            padding: 12px;
            background: #FF9800;
            color: white;
        }
        .nav-link, .back-link {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            z-index: 100;
        }
        .nav-link { bottom: 75px; right: 15px; }
        .back-link { top: 15px; right: 15px; }
        .scan-input-zone { width: 90%; max-width: 500px; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
        .scan-input-container { display: flex; gap: 8px; width: 100%; }
        .scan-input { flex: 1; min-height: 50px; font-size: clamp(22px, 4vw, 32px); padding: 10px 15px; border: 3px solid #000; border-radius: 10px; font-weight: 500; text-align: center; font-family: inherit; background: white; }
        .scan-input:focus { outline: none; border-color: #4CAF50; background: #f0fff0; }
        .camera-button { min-width: 50px; width: 50px; height: 50px; border: 3px solid #000; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .camera-button:active { transform: scale(0.95); background: #e0e0e0; }
        .camera-button svg { width: 30px; height: 30px; }
        .input-hint { font-size: clamp(16px, 2.5vw, 22px); color: #757575; text-align: center; margin: 0; }
            /* Password Protection */
        #password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        #password-overlay.hidden { display: none; }
        .password-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 90%; }
        .password-box h2 { margin-bottom: 10px; color: #333; font-size: 28px; }
        .password-box p { color: #666; margin-bottom: 25px; font-size: 16px; }
        .password-box input { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        .password-box input:focus { outline: none; border-color: #4CAF50; }
        .password-box button { width: 100%; padding: 15px; font-size: 18px; font-weight: 600; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .password-box button:hover { background: #45a049; }
        .password-error { color: #F44336; margin-top: 10px; font-size: 14px; display: none; }
        #main-content { display: none; }
        #main-content.visible { display: block; }
    </style>
</head>
<body>
    <div id="password-overlay">
        <div class="password-box">
            <h2>🔒 Захищено паролем</h2>
            <p>Введіть пароль для доступу</p>
            <input type="password" id="password-input" placeholder="Пароль" autofocus>
            <button onclick="checkPassword()">Увійти</button>
            <div class="password-error" id="password-error">Невірний пароль</div>
        </div>
    </div>
    <div id="main-content">
    <a href="index.html" class="back-link">← Всі екрани</a>

    <div class="screen">
        <div class="order-header">
            OUT/00123
        </div>

        <div class="scrollable-content">
            <div class="instruction-text">
                СКАНУЙ: SKU-12345
            </div>
            <div class="hint-text">
                Назва товару приклад
            </div>

            <!-- ВЕЛИКІ ЛІЧИЛЬНИКИ - найважливіша частина -->
            <div class="counters-container">
                <!-- Залишок -->
                <div class="counter-block counter-remaining">
                    <div class="counter-label">ЗАЛИШОК</div>
                    <div class="counter-value">3</div>
                </div>

                <!-- Вже відсканували -->
                <div class="counter-block counter-scanned">
                    <div class="counter-label">ВЖЕ</div>
                    <div class="counter-value">2</div>
                </div>
            </div>

            <!-- Input zone with camera button -->
            <div class="scan-input-zone">
                <div class="scan-input-container">
                    <input type="text" class="scan-input" placeholder="Скануйте товар" />
                    <button type="button" class="camera-button" onclick="alert('Камера відкриється для сканування товару')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></svg></button>
                </div>
                <p class="input-hint">Або натисніть камеру</p>
            </div>

            <div class="hint-text">
                Тільки скан товару або ВІДМІНА ЗБІРКИ
            </div>
        </div>

        <div class="fixed-bottom">
            <button class="button">
                ВІДМІНИТИ ЗБІРКУ
            </button>
        </div>
    </div>

    <a href="screen-05-success.html" class="nav-link">Наступний екран →</a>
    </div>
    <script>
        const CORRECT_PASSWORD = 'mobileodoo';
        const AUTH_KEY = 'warehouse_app_auth';
        function checkAuth() { if (sessionStorage.getItem(AUTH_KEY) === 'true') showContent(); }
        function checkPassword() {
            const input = document.getElementById('password-input');
            const error = document.getElementById('password-error');
            if (input.value === CORRECT_PASSWORD) { sessionStorage.setItem(AUTH_KEY, 'true'); showContent(); error.style.display = 'none'; }
            else { error.style.display = 'block'; input.value = ''; input.focus(); }
        }
        function showContent() { document.getElementById('password-overlay').classList.add('hidden'); document.getElementById('main-content').classList.add('visible'); }
        document.addEventListener('DOMContentLoaded', function() { checkAuth(); document.getElementById('password-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkPassword(); }); });
    </script>
</body>
</html>
