<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>01. Скан бейджа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: white;
        }
        .screen-title {
            font-size: clamp(50px, 10vw, 90px);
            font-weight: 700;
            text-align: center;
            color: #000;
            margin-bottom: 15px;
            line-height: 1.1;
        }
        .screen-subtitle {
            font-size: clamp(20px, 4vw, 32px);
            color: #757575;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        .screen-icon {
            width: clamp(80px, 18vw, 120px);
            height: clamp(80px, 18vw, 120px);
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(60px, 15vw, 100px);
        }
        .nav-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        .scan-input-zone {
            width: 90%;
            max-width: 500px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .scan-input-container {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .scan-input {
            flex: 1;
            min-height: 60px;
            font-size: clamp(24px, 5vw, 36px);
            padding: 10px 15px;
            border: 3px solid #000;
            border-radius: 10px;
            font-weight: 500;
            text-align: center;
            font-family: inherit;
            background: white;
        }
        .scan-input:focus {
            outline: none;
            border-color: #4CAF50;
            background: #f0fff0;
        }
        .camera-button {
            min-width: 60px;
            width: 60px;
            height: 60px;
            border: 3px solid #000;
            border-radius: 10px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .camera-button:active {
            transform: scale(0.95);
            background: #e0e0e0;
        }
        .camera-button svg {
            width: 35px;
            height: 35px;
        }
        .input-hint {
            font-size: clamp(18px, 3vw, 24px);
            color: #757575;
            text-align: center;
            margin-top: -5px;
        }
            /* Password Protection */
        #password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        #password-overlay.hidden { display: none; }
        .password-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 90%; }
        .password-box h2 { margin-bottom: 10px; color: #333; font-size: 28px; }
        .password-box p { color: #666; margin-bottom: 25px; font-size: 16px; }
        .password-box input { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        .password-box input:focus { outline: none; border-color: #4CAF50; }
        .password-box button { width: 100%; padding: 15px; font-size: 18px; font-weight: 600; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .password-box button:hover { background: #45a049; }
        .password-error { color: #F44336; margin-top: 10px; font-size: 14px; display: none; }
        #main-content { display: none; }
        #main-content.visible { display: block; }
    </style>
</head>
<body>
    <div id="password-overlay">
        <div class="password-box">
            <h2>🔒 Захищено паролем</h2>
            <p>Введіть пароль для доступу</p>
            <input type="password" id="password-input" placeholder="Пароль" autofocus>
            <button onclick="checkPassword()">Увійти</button>
            <div class="password-error" id="password-error">Невірний пароль</div>
        </div>
    </div>
    <div id="main-content">
    <a href="index.html" class="back-link">← Всі екрани</a>

    <div class="screen">
        <h1 class="screen-title">СКАНУЙТЕ БЕЙДЖ</h1>

        <div class="screen-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="100%" height="100%">
                <rect x="4" y="6" width="16" height="12" rx="2" />
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                <line x1="8" y1="10" x2="8" y2="14" />
                <line x1="10" y1="10" x2="10" y2="14" />
                <line x1="12" y1="10" x2="12" y2="14" />
                <line x1="14" y1="10" x2="14" y2="14" />
                <line x1="16" y1="10" x2="16" y2="14" />
            </svg>
        </div>

        <p class="screen-subtitle">
            Піднесіть сканер до штрихкоду бейджа
        </p>

        <!-- Input zone with camera button -->
        <div class="scan-input-zone">
            <div class="scan-input-container">
                <input
                    type="text"
                    class="scan-input"
                    placeholder="Скануйте або введіть"
                />
                <button
                    type="button"
                    class="camera-button"
                    onclick="alert('Камера відкриється для сканування штрихкоду')"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                        <circle cx="12" cy="13" r="4" />
                    </svg>
                </button>
            </div>
            <p class="input-hint">Або натисніть камеру для сканування</p>
        </div>
    </div>

    <a href="screen-01b-badge-error.html" class="nav-link">Наступний екран →</a>
    </div>
    <script>
        const CORRECT_PASSWORD = 'mobileodoo';
        const AUTH_KEY = 'warehouse_app_auth';
        function checkAuth() { if (sessionStorage.getItem(AUTH_KEY) === 'true') showContent(); }
        function checkPassword() {
            const input = document.getElementById('password-input');
            const error = document.getElementById('password-error');
            if (input.value === CORRECT_PASSWORD) { sessionStorage.setItem(AUTH_KEY, 'true'); showContent(); error.style.display = 'none'; }
            else { error.style.display = 'block'; input.value = ''; input.focus(); }
        }
        function showContent() { document.getElementById('password-overlay').classList.add('hidden'); document.getElementById('main-content').classList.add('visible'); }
        document.addEventListener('DOMContentLoaded', function() { checkAuth(); document.getElementById('password-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkPassword(); }); });
    </script>
</body>
</html>
