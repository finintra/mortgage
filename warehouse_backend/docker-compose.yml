version: '3.8'

services:
  backend:
    build: .
    container_name: warehouse_backend
    ports:
      - "8000:8000"
    environment:
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=True
      - API_PREFIX=/api

      # Security
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440

      # Odoo Connection - update these values
      - ODOO_URL=${ODOO_URL:-http://host.docker.internal:8069}
      - ODOO_DB=${ODOO_DB:-odoo15}
      - ODOO_USERNAME=${ODOO_USERNAME:-admin}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-admin}

      # Logging
      - LOG_LEVEL=INFO

    # If Odoo is also running in Docker, use network
    # networks:
    #   - odoo_network

    restart: unless-stopped

# Uncomment if Odoo is also running in Docker
# networks:
#   odoo_network:
#     external: true
