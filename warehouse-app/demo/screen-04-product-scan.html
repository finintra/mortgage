<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>04. Сканування товарів (ГОЛОВНИЙ ЕКРАН)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            background: white;
        }
        .order-header {
            width: 100%;
            background: white;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #000;
            font-size: clamp(60px, 10vw, 100px);
            font-weight: 700;
        }
        .scrollable-content {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .instruction-text {
            font-size: clamp(50px, 7vw, 80px);
            font-weight: 600;
            text-align: center;
            margin: 20px 0;
        }
        .hint-text {
            font-size: clamp(25px, 3.5vw, 35px);
            color: #757575;
            text-align: center;
            margin: 15px 0;
        }
        .counters-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 700px;
            margin: 40px 0;
        }
        .counter-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            border-radius: 16px;
        }
        .counter-label {
            font-size: clamp(30px, 4vw, 40px);
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .counter-value {
            font-size: clamp(140px, 20vw, 200px);
            font-weight: 700;
            line-height: 1;
        }
        .counter-remaining {
            background: #FFF3E0;
            color: #FF9800;
        }
        .counter-remaining .counter-value {
            color: #FF9800;
        }
        .counter-scanned {
            background: #E8F5E9;
            color: #4CAF50;
        }
        .counter-scanned .counter-value {
            color: #4CAF50;
        }
        .counter-total {
            background: #F5F5F5;
            color: #000;
        }
        .counter-total .counter-value {
            color: #000;
        }
        .fixed-bottom {
            width: 100%;
            padding: 20px;
            background: white;
            border-top: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .button {
            min-height: 100px;
            width: 90%;
            max-width: 600px;
            border: none;
            border-radius: 12px;
            font-size: clamp(40px, 6vw, 60px);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            background: #FF9800;
            color: white;
        }
        .nav-link, .back-link {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
            z-index: 100;
        }
        .nav-link { bottom: 150px; right: 20px; }
        .back-link { top: 20px; right: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Всі екрани</a>

    <div class="screen">
        <div class="order-header">
            OUT/00123
        </div>

        <div class="scrollable-content">
            <div class="instruction-text">
                СКАНУЙ: SKU-12345
            </div>
            <div class="hint-text" style="font-size: clamp(35px, 5vw, 50px); margin-bottom: 30px;">
                Назва товару приклад
            </div>

            <!-- ВЕЛИКІ ЛІЧИЛЬНИКИ - найважливіша частина -->
            <div class="counters-container">
                <!-- Залишок -->
                <div class="counter-block counter-remaining">
                    <div class="counter-label">ЗАЛИШОК</div>
                    <div class="counter-value">3</div>
                </div>

                <!-- Вже відсканували -->
                <div class="counter-block counter-scanned">
                    <div class="counter-label">ВЖЕ</div>
                    <div class="counter-value">2</div>
                </div>

                <!-- Потрібно всього -->
                <div class="counter-block counter-total">
                    <div class="counter-label">ПОТРІБНО ВСЬОГО</div>
                    <div class="counter-value">5</div>
                </div>
            </div>

            <div class="hint-text" style="margin-top: 30px;">
                Тільки скан товару або ВІДМІНА ЗБІРКИ
            </div>
        </div>

        <div class="fixed-bottom">
            <button class="button">
                ВІДМІНИТИ ЗБІРКУ
            </button>
        </div>
    </div>

    <a href="screen-05-success.html" class="nav-link">Наступний екран →</a>
</body>
</html>
