<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>02. Введення PIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: white;
        }
        .screen-title {
            font-size: clamp(80px, 15vw, 150px);
            font-weight: 700;
            text-align: center;
            color: #000;
            margin-bottom: 30px;
        }
        .pin-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 500px;
        }
        .pin-dots {
            display: flex;
            gap: 20px;
            margin: 40px 0;
        }
        .pin-dot {
            width: clamp(50px, 10vw, 80px);
            height: clamp(50px, 10vw, 80px);
            border-radius: 50%;
            border: 4px solid #000;
            background: white;
        }
        .pin-dot.filled {
            background: #000;
        }
        .pin-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .pin-key {
            height: clamp(70px, 15vw, 100px);
            border: 2px solid #000;
            border-radius: 8px;
            background: white;
            font-size: clamp(40px, 8vw, 60px);
            font-weight: 600;
            cursor: pointer;
        }
        .pin-key.delete {
            grid-column: span 3;
            background: #f5f5f5;
            font-size: clamp(30px, 6vw, 45px);
        }
        .nav-link, .back-link {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        .nav-link { bottom: 20px; right: 20px; }
        .back-link { top: 20px; left: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Всі екрани</a>

    <div class="screen">
        <h1 class="screen-title">ВВЕДІТЬ PIN</h1>

        <div class="pin-container">
            <div class="pin-dots">
                <div class="pin-dot filled"></div>
                <div class="pin-dot filled"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>

            <div class="pin-keypad">
                <button class="pin-key">1</button>
                <button class="pin-key">2</button>
                <button class="pin-key">3</button>
                <button class="pin-key">4</button>
                <button class="pin-key">5</button>
                <button class="pin-key">6</button>
                <button class="pin-key">7</button>
                <button class="pin-key">8</button>
                <button class="pin-key">9</button>
                <button class="pin-key" style="grid-column: 2;">0</button>
                <button class="pin-key delete">Видалити</button>
            </div>
        </div>
    </div>

    <a href="screen-03-invoice-scan.html" class="nav-link">Наступний екран →</a>
</body>
</html>
