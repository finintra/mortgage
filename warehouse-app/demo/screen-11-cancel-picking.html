<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11. Відміна збірки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: white;
            gap: 30px;
        }
        .warning-icon {
            font-size: clamp(80px, 15vw, 120px);
            color: #F44336;
        }
        .screen-title {
            font-size: clamp(50px, 10vw, 85px);
            font-weight: 700;
            text-align: center;
            color: #F44336;
            line-height: 1.1;
        }
        .screen-subtitle {
            font-size: clamp(28px, 5vw, 45px);
            text-align: center;
            color: #666;
            line-height: 1.3;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 500px;
        }
        .button {
            min-height: 75px;
            border: none;
            border-radius: 12px;
            font-size: clamp(30px, 6vw, 50px);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            padding: 15px;
        }
        .button-confirm {
            background: #F44336;
            color: white;
        }
        .button-cancel {
            background: #9E9E9E;
            color: white;
        }
        .button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .nav-link, .back-link {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        .nav-link { bottom: 20px; right: 20px; }
        .back-link { top: 20px; left: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Всі екрани</a>

    <div class="screen">
        <div class="warning-icon">⚠️</div>

        <h1 class="screen-title">ВІДМІНИТИ ЗБІРКУ?</h1>

        <p class="screen-subtitle">
            Прогрес буде втрачено
        </p>

        <div class="button-container">
            <button class="button button-confirm">
                ТАК, ВІДМІНИТИ
            </button>
            <button class="button button-cancel">
                НІ, ПРОДОВЖИТИ
            </button>
        </div>
    </div>

    <a href="screen-12-account-locked.html" class="nav-link">Наступний екран →</a>
</body>
</html>
