<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>09. Замовлення зібрано</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            background: white;
        }
        .header-green {
            width: 100%;
            background: #4CAF50;
            padding: 25px 15px;
            text-align: center;
        }
        .screen-title {
            font-size: clamp(45px, 9vw, 75px);
            font-weight: 700;
            color: white;
            margin: 0;
            line-height: 1.1;
        }
        .scrollable-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
        }
        .instruction-text {
            font-size: clamp(32px, 6vw, 55px);
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.2;
        }
        .ttn-count {
            font-size: clamp(60px, 10vw, 90px);
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
        }
        .button {
            min-height: 70px;
            width: 90%;
            max-width: 500px;
            border: none;
            border-radius: 12px;
            font-size: clamp(28px, 5vw, 45px);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            padding: 15px;
            background: #9E9E9E;
            color: white;
        }
        .nav-link, .back-link {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        .nav-link { bottom: 20px; right: 20px; }
        .back-link { top: 20px; left: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Всі екрани</a>

    <div class="screen">
        <div class="header-green">
            <h1 class="screen-title">
                ЗАМОВЛЕННЯ ЗІБРАНО
            </h1>
        </div>

        <div class="scrollable-content">
            <div class="instruction-text">
                НАКЛЕЙТЕ ТТНки НА ТОВАРИ
            </div>

            <div class="ttn-count">
                5 ШТУК
            </div>

            <button class="button">
                НАКЛІЄНО 5 ШТУК
            </button>
        </div>
    </div>

    <a href="screen-10-confirm-order.html" class="nav-link">Наступний екран →</a>
</body>
</html>
