<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>03. Скан накладної</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: white;
        }
        .screen-title {
            font-size: clamp(80px, 15vw, 150px);
            font-weight: 700;
            text-align: center;
            color: #000;
            margin-bottom: 30px;
            line-height: 1.2;
        }
        .screen-subtitle {
            font-size: clamp(30px, 5vw, 50px);
            color: #757575;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.3;
        }
        .screen-icon {
            width: clamp(120px, 25vw, 200px);
            height: clamp(120px, 25vw, 200px);
            margin: 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(80px, 20vw, 150px);
        }
        .nav-link, .back-link {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        .nav-link { bottom: 20px; right: 20px; }
        .back-link { top: 20px; left: 20px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Всі екрани</a>

    <div class="screen">
        <h1 class="screen-title">СКАНУЙ НАКЛАДНУ (OUT...)</h1>

        <div class="screen-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="100%" height="100%">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        .scan-input-zone { width: 90%; max-width: 600px; margin: 30px 0; display: flex; flex-direction: column; gap: 20px; }
        .scan-input-container { display: flex; gap: 15px; width: 100%; }
        .scan-input { flex: 1; min-height: 80px; font-size: clamp(35px, 6vw, 50px); padding: 15px 25px; border: 3px solid #000; border-radius: 12px; font-weight: 500; text-align: center; font-family: inherit; background: white; }
        .scan-input:focus { outline: none; border-color: #4CAF50; background: #f0fff0; }
        .camera-button { min-width: 80px; width: 80px; height: 80px; border: 3px solid #000; border-radius: 12px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .camera-button:active { transform: scale(0.95); background: #e0e0e0; }
        .camera-button svg { width: 50px; height: 50px; }
        .input-hint { font-size: clamp(25px, 3.5vw, 35px); color: #757575; text-align: center; margin-top: -10px; }
                <polyline points="14 2 14 8 20 8" />
                <line x1="8" y1="12" x2="16" y2="12" />
                <line x1="8" y1="16" x2="16" y2="16" />
            </svg>
        </div>

        <p class="screen-subtitle">
            Піднесіть сканер до накладної
        </p>
    </div>

    <a href="screen-04-product-scan.html" class="nav-link">Наступний екран →</a>
</body>
</html>
